# Render Blueprint: https://dashboard.render.com/blueprints
# При первом создании задайте: BOT_TOKEN, ADMIN_TELEGRAM_IDS

databases:
  - name: cardigans-db
    plan: free
    databaseName: cardigans
    user: cardigans

services:
  - type: web
    name: cardigans-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate -w server && npm run build -w server
    startCommand: npm run db:deploy -w server && npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cardigans-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://drgnadmin.github.io
      - key: TELEGRAM_BOT_USERNAME
        value: MiniAppShowcaseCGbot
      - key: ADMIN_TELEGRAM_IDS
        sync: false

  # Phugytal — публичный сайт-информатор + админка
  - type: web
    name: phugytal
    runtime: node
    plan: free
    rootDir: phugytal
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@phugytal.local
      - key: ADMIN_PASSWORD
        value: ChangeMeAdmin123!
